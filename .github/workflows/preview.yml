# Een Preview per pull request, zoals op Vercel: een eigen Neon-branch (kopie van productie),
# de migraties van de PR daarop, en een Worker Preview met een vaste URL die in de PR komt.
# Het adres is de slug van de branchnaam: feature/Sponsoren-blok wordt
# feature-sponsoren-blok-site.svv04.workers.dev, de Neon-branch preview/feature-sponsoren-blok.
# Bij het sluiten van de PR worden de Neon-branch en de Preview weer opgeruimd.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: Preview deployen
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - uses: actions/checkout@v5
      # Kleine letters, alleen a-z, 0-9 en '-'. Maximaal 50 tekens: "<naam>-site" moet als
      # DNS-label binnen 63 tekens passen. Lege slug (alleen tekens als '/'): pr-<nummer>.
      - name: Naam van de Preview
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          slug=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-50 | sed -E 's/-+$//')
          [ -n "$slug" ] || slug="pr-$PR_NUMBER"
          echo "PREVIEW_NAME=$slug" >> "$GITHUB_ENV"
          echo "NEON_BRANCH=preview/$slug" >> "$GITHUB_ENV"
          echo "Preview: $slug"
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Hergebruikt de branch bij een volgende push, zodat testdata in de preview blijft staan.
      - name: Neon-branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ${{ env.NEON_BRANCH }}

      - name: Migraties
        run: pnpm migrate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      - name: Build
        run: pnpm cf:build
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          NEXT_PUBLIC_CLUBDATA_CLIENT_ID: ${{ vars.NEXT_PUBLIC_CLUBDATA_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

      # De secrets van deze Preview. DATABASE_URL wijst naar de eigen Neon-branch; de rest zijn
      # test-sleutels die voor alle previews gelijk zijn. Geen Turnstile en geen toegangscode.
      - name: Secrets voor de Preview
        run: |
          jq -n \
            --arg DATABASE_URL "${{ steps.neon.outputs.db_url_pooled }}" \
            --arg PAYLOAD_SECRET "$PAYLOAD_SECRET" \
            --arg BLOB_READ_WRITE_TOKEN "$BLOB_READ_WRITE_TOKEN" \
            --arg RESEND_API_KEY "$RESEND_API_KEY" \
            --arg CRON_SECRET "$CRON_SECRET" \
            --arg MOLLIE_API_KEY "$MOLLIE_API_KEY" \
            --arg AI_ASSISTANT_ENABLED "$AI_ASSISTANT_ENABLED" \
            '$ARGS.named | with_entries(select(.value != ""))' > "$RUNNER_TEMP/preview-secrets.json"
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
          AI_ASSISTANT_ENABLED: ${{ vars.AI_ASSISTANT_ENABLED }}

      - name: Cache vullen
        run: pnpm opennextjs-cloudflare populateCache remote

      - name: Preview deployen
        id: preview
        run: |
          pnpm wrangler preview --name "$PREVIEW_NAME" \
            --secrets-file "$RUNNER_TEMP/preview-secrets.json" \
            --message "${{ github.event.pull_request.head.sha }}" \
            --json > "$RUNNER_TEMP/preview.json"
          rm "$RUNNER_TEMP/preview-secrets.json"
          cat "$RUNNER_TEMP/preview.json"
          echo "json=$(jq -c . "$RUNNER_TEMP/preview.json")" >> "$GITHUB_OUTPUT"

      - name: Link in de PR
        uses: actions/github-script@v8
        env:
          PREVIEW_JSON: ${{ steps.preview.outputs.json }}
        with:
          script: |
            const result = JSON.parse(process.env.PREVIEW_JSON)
            // Pak elke URL uit de uitvoer van wrangler preview, welke vorm die ook heeft.
            const urls = [...new Set(JSON.stringify(result).match(/https:\/\/[^"\s]+/g) ?? [])]
            const marker = '<!-- svv04-preview -->'
            const body = [
              marker,
              `**Preview** voor ${context.payload.pull_request.head.sha.slice(0, 7)}`,
              '',
              ...urls.map((url) => `- ${url}`),
              '',
              `Database: Neon-branch \`${process.env.NEON_BRANCH}\` (kopie van productie).`,
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const existing = comments.find((c) => c.body?.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  cleanup:
    name: Preview opruimen
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - uses: actions/checkout@v5
      # Kleine letters, alleen a-z, 0-9 en '-'. Maximaal 50 tekens: "<naam>-site" moet als
      # DNS-label binnen 63 tekens passen. Lege slug (alleen tekens als '/'): pr-<nummer>.
      - name: Naam van de Preview
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          slug=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-50 | sed -E 's/-+$//')
          [ -n "$slug" ] || slug="pr-$PR_NUMBER"
          echo "PREVIEW_NAME=$slug" >> "$GITHUB_ENV"
          echo "NEON_BRANCH=preview/$slug" >> "$GITHUB_ENV"
          echo "Preview: $slug"
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preview verwijderen
        run: pnpm wrangler preview delete --name "$PREVIEW_NAME" || true
      - name: Neon-branch verwijderen
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ env.NEON_BRANCH }}
